name: Build & publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mconcepcionb/marslabs.dev
  BIOME_VERSION: 2.5.14

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint + formato + orden de imports: `biome ci` falla si hay cualquier
      # diagnóstico (es el comando recomendado para CI, no auto-fixea).
      - name: Biome (lint + format)
        run: npx biome ci .

      # Chequeo de tipos real de Astro (es el que entiende .astro).
      - name: Astro typecheck
        run: npx astro check

      # knip: código y dependencias sin usar. Informativo por ahora
      # (continue-on-error) — no bloquea el pipeline todavía.
      - name: Knip (informativo)
        run: npx knip
        continue-on-error: true

      # Presupuesto de rendimiento: build del SSG + medición real (FCP/CLS) en
      # Chromium. Falla el pipeline si hay regresión.
      - name: Build (dist)
        run: pnpm build
        env:
          SKIP_CLS: "1"

      - name: Install Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      - name: Performance budget
        run: pnpm run perf

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El HTML se cachea en el edge (ticket-004) con TTL corto; sin purge, un
      # deploy se sigue sirviendo hasta 300 s. Purga tras publicar la imagen.
      # Se salta (sin fallar) si el token o el zone id no están configurados.
      - name: Purge Cloudflare cache
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ZONE_ID not set; skipping cache purge."
            exit 0
          fi
          resp=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "$body"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Cloudflare purge failed with HTTP $code"
            exit 1
          fi
          printf '%s' "$body" | grep -q '"success":true' \
            || { echo "::error::Cloudflare purge did not report success"; exit 1; }