name: Build & publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mconcepcionb/marslabs.dev
  BIOME_VERSION: 2.5.14

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint + formato + orden de imports: `biome ci` falla si hay cualquier
      # diagnóstico (es el comando recomendado para CI, no auto-fixea).
      - name: Biome (lint + format)
        run: npx biome ci .

      # Chequeo de tipos real de Astro (es el que entiende .astro).
      - name: Astro typecheck
        run: npx astro check

      # knip: código y dependencias sin usar. Informativo por ahora
      # (continue-on-error) — no bloquea el pipeline todavía.
      - name: Knip (informativo)
        run: npx knip
        continue-on-error: true

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max