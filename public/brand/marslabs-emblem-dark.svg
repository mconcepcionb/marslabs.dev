<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Mars Labs">
  <defs>
    <radialGradient id="marsE" cx="36%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#FFB98A"/>
      <stop offset="42%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#D8481F"/>
    </radialGradient>
    <linearGradient id="stE" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B3A4A" stop-opacity="0"/>
      <stop offset="35%" stop-color="#26D0F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0AF0FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="88" fill="#06080C"/>

  <!-- estelas de velocidad -->
  <g>
    <rect x="20" y="196" width="472" height="6" fill="url(#stE)" opacity="0.85"/>
    <rect x="20" y="230" width="472" height="4" fill="url(#stE)" opacity="0.6"/>
    <rect x="20" y="300" width="472" height="5" fill="url(#stE)" opacity="0.7"/>
    <rect x="20" y="334" width="472" height="3" fill="url(#stE)" opacity="0.45"/>
  </g>

  <!-- Marte estilizado -->
  <g transform="translate(256,208)">
    <circle r="118" fill="url(#marsE)"/>
    <g fill="#9C2E18" opacity="0.78">
      <circle cx="-46" cy="-42" r="20"/>
      <circle cx="20" cy="-56" r="12"/>
      <circle cx="42" cy="32" r="26"/>
      <circle cx="-28" cy="54" r="16"/>
      <circle cx="6" cy="-12" r="9"/>
    </g>
    <g fill="#7C2312" opacity="0.55">
      <circle cx="-68" cy="24" r="11"/>
      <circle cx="64" cy="-18" r="10"/>
    </g>
    <path d="M-104 -56 A118 118 0 0 1 56 -104" fill="none" stroke="#FFE0C8" stroke-width="6" opacity="0.55" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="424" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="62" font-weight="800" letter-spacing="3" fill="#FFFFFF">MARS<tspan fill="#26D0F0"> LABS</tspan></text>
  <rect x="176" y="446" width="160" height="6" rx="3" fill="#26D0F0" opacity="0.9"/>
</svg>
