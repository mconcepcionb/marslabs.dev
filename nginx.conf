server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas limpias del SSG (Astro genera /blog/<slug>/index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    # Assets inmutables (nombre con hash): cache larga + open_file_cache
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        open_file_cache max=1024 inactive=60s;
        open_file_cache_valid 30s;
    }
    # En esta imagen el contenido NO se publica en caliente (se reconstruye vía
    # CI + pull), así que los HTML sí pueden cachearse: cache corta por revalidación.
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}