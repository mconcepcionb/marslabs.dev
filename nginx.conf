server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas limpias del SSG (Astro genera /blog/<slug>/index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    # Assets inmutables (nombre con hash): cache larga en edge y navegador.
    # Sin `expires`: junto a add_header emitiría dos cabeceras Cache-Control.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
        open_file_cache max=1024 inactive=60s;
        open_file_cache_valid 30s;
    }
    # HTML: TTL corto en edge (s-maxage) para que la Cache Rule de Cloudflare lo
    # cachee; el navegador revalida. El deploy purga el edge (ticket-005).
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, s-maxage=300, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}